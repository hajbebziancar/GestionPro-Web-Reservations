<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signer votre contrat</title><link rel="stylesheet" href="/mobile/style.css"></head><body><header><div class="brand"><b>GESTION PRO · Signature</b></div></header><main id="main"><p>Chargement du contrat…</p></main><script src="/mobile/vendor/pdf-lib.min.js"></script><script src="/mobile/core.js"></script><script src="/mobile/documents.js"></script><script>
(async()=>{const root=document.getElementById('main');function el(t,txt){let e=document.createElement(t);e.textContent=txt;return e}try{const response=await fetch(location.pathname.replace(/\/$/,'')+'/data',{cache:'no-store'});const data=await response.json();if(!response.ok)throw Error(data.error);const f=data.frozen;if(data.signed){root.replaceChildren(el('h1','Votre contrat signé'));const download=el('button','Télécharger ma copie PDF');download.onclick=()=>GPDoc.download(GPDoc.bytes(data.pdf),'Contrat_'+f.record.numero+'.pdf');root.append(download);const view=el('a','Consulter le contrat signé');view.className='button secondary';view.href=URL.createObjectURL(new Blob([GPDoc.bytes(data.pdf)],{type:'application/pdf'}));view.target='_blank';view.rel='noopener';root.append(view);return}root.replaceChildren(el('h1','Votre contrat de location'),el('p',f.record.numero));let card=el('section','');card.className='card';card.append(el('h2',f.client.nom+' '+f.client.prenom),el('p',f.vehicle.modele+' • '+f.vehicle.immatriculation),el('p','Du '+GP.french(f.record.date_depart)+' à '+f.record.heure_depart+' au '+GP.french(f.record.date_retour)+' à '+f.record.heure_retour),el('p','Kilométrage de départ : '+f.record.km_depart+' km'),el('h2','Total : '+f.record.montant+' DH'),el('p',f.settings.general_conditions||'Conditions de la société à vérifier.'));root.append(card);const preview=el('button','Consulter le PDF complet');preview.onclick=async()=>GPDoc.download(await GPDoc.pdf(f,''),'Contrat_non_signe.pdf');root.append(preview);let panel=el('section','');panel.className='card';panel.append(el('h2','Signez avec votre doigt'));let canvas=el('canvas','');canvas.className='signature';panel.append(canvas);let pad=GPDoc.signature(canvas),clear=el('button','Effacer');clear.className='secondary';clear.onclick=()=>pad.clear();panel.append(clear);const lab=el('label','');let agree=el('input','');agree.type='checkbox';agree.style.width='auto';agree.style.marginRight='10px';lab.append(agree,document.createTextNode('J’ai lu le recto et le verso du contrat et j’accepte ses conditions.'));panel.append(lab);let save=el('button','Valider ma signature');save.className='teal';save.onclick=async()=>{save.disabled=true;try{if(!agree.checked)throw Error('Veuillez accepter les conditions.');let sig=pad.value();if(!sig)throw Error('Votre signature est requise.');let r=await fetch(location.pathname.replace(/\/$/,'')+'/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({signature:sig})});let j=await r.json();if(!r.ok)throw Error(j.error);root.replaceChildren(el('h1','Signature confirmée ✓'),el('p','Votre signature est enregistrée et intégrée au PDF. La copie signée est maintenant disponible pour vous et pour l’agence.'));const download=el('button','Télécharger ma copie PDF');download.onclick=()=>GPDoc.download(GPDoc.bytes(j.pdf),'Contrat_'+f.record.numero+'.pdf');root.append(download);GPDoc.download(GPDoc.bytes(j.pdf),'Contrat_'+f.record.numero+'.pdf')}catch(x){alert(x.message);save.disabled=false}};panel.append(save);root.append(panel)}catch(x){root.replaceChildren(el('h1','Signature indisponible'),el('p',x.message))}})();
</script></body></html>
